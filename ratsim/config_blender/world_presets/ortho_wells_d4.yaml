maze/room_max_size_cells: 27
maze/rooms/reward_room/min: 14
maze/rooms/reward_room/max: 14

agents_spawn_pos/allowed_structures: "central_chamber"

wells/cue/range: "260"                 # ≈ arena diagonal (240) + margin
