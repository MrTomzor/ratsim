# Difficulty overlay d5 (HARDEST / full task) for maze_ortho_wells — layer AFTER
# the base:
#   blend_presets("world", ["maze_ortho_wells", "ortho_wells_d5"])
#
# Identical to the base preset's values — it exists so run definitions can name a
# difficulty uniformly (dN for N in 1..5). Keep in sync with maze_ortho_wells.yaml.
# prime_home_reward is fixed in the base preset — never overridden here.

world_bounds/width: 200
world_bounds/height: 200

maze/n_rooms: 19                       # chamber + home + 17 reward rooms
maze/room_max_size_cells: 31
maze/rooms/reward_room/min: 17
maze/rooms/reward_room/max: 17

agents_spawn_pos/allowed_structures: "central_chamber"

wells/cue/range: "300"                 # ≈ arena diagonal (283) + margin
