# Wells alternation (Home/Random, Widloski-style) on the dynamic-doors memory maze.
#
# Geometry = maze_memorymaze_15x15_dyn_doors_near.yaml (copied verbatim below), but the
# trigger is PASSING instead of proximity: every door (knocked-out connector) is dynamic
# and closes BEHIND the agent once it has passed through (entered on one side, left on
# another; turning back doesn't count). Connectivity guard ON, so the floor stays one
# component and every well stays reachable.
# Task = the wells family of maze_ortho_wells_nohomeprime.yaml: ALL 9 rooms get a well,
# one random room is labelled home_well_room each episode, the scheduler alternates
# Home / cued-Random trials, and the agent spawns at Home. No Home prime reward.
#
# Use with agent preset sphereagent_2d_lidar_wells_cue (sector_signal 'cue' sensor).
#
# Mimics the memory-maze task layout:
# https://github.com/jurgisp/memory-maze (which uses DeepMind labmaze under the hood).
#
# Algorithm (MazeLayoutLoader, mode="memory_maze"):
#   1. Rejection-sample odd-aligned, odd-sized rooms.
#   2. DFS recursive backtracker fills every remaining odd cell with 1-wide corridors.
#   3. For every adjacent region pair, knock out exactly one separating wall (mandatory),
#      then knock out each remaining candidate wall with extra_connection_probability (loops).

seed: 42
chunk_width: 64

height_generation/mode: superflat
height_generation/superflat_height: 0

vegetation/allowed_prefabs: ""
house_generation/mode: uniform
house_generation/allowed_prefabs: ""

# Divide by cell-size to get memory-maze cell count (45x45 / 3 = 15x15 = original largest maze size)
# world_bounds/width: 45
# world_bounds/height: 45
world_bounds/width: 75
world_bounds/height: 75
world_bounds/structures_margin: 0
world_bounds/boundary_type: visible_wall
world_bounds/boundary_height: 20

# ─────────────────────────────────────────────
#  Layout / maze
# ─────────────────────────────────────────────
layout/mode: maze
layout/structures/types: ""
layout/roads/mode: none

maze/mode: memory_maze

maze/cell_size: 5.0
maze/wall_height: 5.0
# maze/cell_size: 3.0
# maze/wall_height: 3.0

# Room budget (= labmaze max_rooms). Rejection sampling stops at this count or when
# room_max_attempts retries are exhausted. memory-maze 11x11 uses 6.
maze/n_rooms: 9

# memory-maze 11x11 uses room_min_size=3, room_max_size=5. Both are rounded up to odd
# by this loader if even values are passed. Min must be >=3.
maze/room_min_size_cells: 3
maze/room_max_size_cells: 3

# Inner retry budget: rejection-sample this many positions per outer attempt before
# giving up and restarting from scratch (matches labmaze default 1000).
maze/room_max_attempts: 1000

# Outer retry budget: greedy random placement often paints itself into a corner near
# the theoretical packing limit (e.g. 9 rooms of size 3 in a 15x15 mask), so we
# restart from scratch up to this many times if the inner loop falls short. Each
# attempt is independent of the last, so even ~10% per-attempt success rate
# converges to >99.99% with 100 outer retries.
maze/room_placement_retries: 100

# Loop density. labmaze default 0.0 = pure tree (one wall opened per region pair).
# Increase toward 1.0 for densely-connected mazes with many shortcuts.
maze/extra_connection_probability: 0.0

# 1-cell wall ring around the mask edge.
maze/border_walls: 1

maze/semantic_name: maze_wall

# Spawn AT the Home well (as maze_ortho_wells_nohomeprime). Generic pipeline
# force-loads the wall chunks around the candidate before physics-checking.
agents_spawn_pos/mode: in_structures
agents_spawn_pos/allowed_structures: "home_well_room"
agents_spawn_pos/randomize_rotation: 1

# ─────────────────────────────────────────────
#  Room labeling — every room has a well; one random room is Home each episode
# ─────────────────────────────────────────────
# AssignRoomTypes shuffles types across rooms, so home_well_room lands in a different
# (seeded) room every reset. 1 + 8 = maze/n_rooms (9); the loader errors if the maze
# packs fewer rooms than these mins.
maze/rooms/types: "home_well_room, reward_room"
maze/rooms/home_well_room/min: 1
maze/rooms/home_well_room/max: 1
maze/rooms/reward_room/min: 8
maze/rooms/reward_room/max: 8

# ─────────────────────────────────────────────
#  Reward objects: DISABLED (wells dispense instead)
# ─────────────────────────────────────────────
reward_objects/uniform_density: "0"
reward_objects/allowed_structures: ""

# ─────────────────────────────────────────────
#  Wells — one per room (mechanics as maze_ortho_wells_nohomeprime)
# ─────────────────────────────────────────────
wells/enabled: "1"
wells/prefab_name: well_basic
wells/seed_key: reward
wells/allowed_structures: "reward_room, home_well_room"
wells/reward_room/min_per_structure: "1"
wells/reward_room/max_per_structure: "1"
wells/home_well_room/min_per_structure: "1"
wells/home_well_room/max_per_structure: "1"

# Rooms are 3x3 cells of 5 m; the well lands on a random cell, kept off the walls.
wells/room_edge_buffer: "2.0"

wells/arrival_radius: "3.0"
wells/dispense_delay_steps: "10"
wells/cooldown_steps: "60"
wells/deplete_on_dispense: "0"
wells/reward_prefab: reward_obj1
wells/reward_spawn_min_dist: "1.0"     # spawn just OUTSIDE the collideable well
wells/reward_spawn_max_dist: "1.7"
wells/rewards_per_dispense: "3"
wells/debug_gizmo: "1"

# Cue = abstract LED on the 'cue' channel, no wall occlusion. Range >= arena diagonal
# (~106 m for 75x75) so it is sensable anywhere.
wells/cue/mode: until_depleted
wells/cue/duration_steps: "30"    # used only when mode=timed
wells/cue/channel: cue
wells/cue/range: "150"
wells/cue/strength: "1.0"
wells/cue/falloff: linear

# ─────────────────────────────────────────────
#  Home/Random alternation scheduler
# ─────────────────────────────────────────────
well_schedule/enabled: "1"
well_schedule/home_source: structure
well_schedule/home_structure_type: home_well_room
well_schedule/home_well_id: "-1"
well_schedule/first_trial: random
well_schedule/prime_home_reward: 0
well_schedule/random_delay_steps: "10"
well_schedule/home_delay_steps: "10"
well_schedule/inter_trial_delay_min_steps: "0"
well_schedule/inter_trial_delay_max_steps: "0"
well_schedule/state_topic: "/well/state"

# ─────────────────────────────────────────────
#  Misc
# ─────────────────────────────────────────────
smoke/global_smoke_enabled: "0"
chaotic_walkers/enabled: "0"

# ─────────────────────────────────────────────
#  Dynamic cells (MazeLayoutLoader.DynamicCells.cs)
# ─────────────────────────────────────────────
maze/dynamic_cells/enabled: 1
maze/dynamic_cells/eligible: doors
maze/dynamic_cells/trigger: block_when_passed
maze/dynamic_cells/spawn_exclusion_radius: 7.5
maze/dynamic_cells/connectivity_guard: 1
maze/dynamic_cells/on_guard_fail: forever
maze/dynamic_cells/reopen_after_steps: -1
maze/dynamic_cells/semantic_name: ""
