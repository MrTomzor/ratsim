prefab_name: SphereAgent
name_prefix: rat1
sensors:
  - name: lidar2d
    maxRange: 20.0
    angleStartDeg: -90
    angleEndDeg: 90
    angleIncrementDeg: 10
    occlusionRegion: none
    occlusionDistance: 0.5
    semanticSet: full_semantic_set
  - name: odom
    rl_scaling_mode: automatic
  - name: collision
  - name: compass
    biasRad: 0.0
  - name: sector_signal
    channels: reward
    nSectors: 5
    sigmaBins: 1.0
    topicPrefix: /sector_signal
actuators: velocity
velocity/steeringBias: 0.0
velocity/blockLeftTurn: false
velocity/blockRightTurn: false
max_health: 100.0
