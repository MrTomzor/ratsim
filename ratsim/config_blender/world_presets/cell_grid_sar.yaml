# "SAR cell grid": a 2x2 grid of fenced cells with a hole in every fence between neighbours.
# Two cell types, placed randomly per seed (maze/rooms/types, 2 of each):
#   park  -- trees + rock1 boulders, chaotic walkers, no rewards
#   urban -- two house_basic per cell, collapsed walls + smoke + 4 rewards per house
#            (house/smoke/reward settings as in superdyna_houses)
# The per-type split uses CityLoader per-container keys (city/<type>/*) for houses and rocks,
# and the structure-type spawn filters on TreeLoader (vegetation/allowed_structures) and
# ChaoticWalkersLoader (chaotic_walkers/allowed_structures).
#
# Geometry (maze/cell_size = 2 m): cells 56x52 cells = 112x104 m (twice the side length of
# cell_grid_households), fences 1 cell = 2 m, outer fence 2 m:
# grid = 2*112 + 2 + 2*2 = 230 m x 2*104 + 2 + 2*2 = 214 m. World 236x220 -> mask 118x110
# cells, which fits the 115x107 grid plus the 1-cell border ring.
# Footprints: house_basic 30x21.5 m (diagonal 37 m), rock1 27x26 m (diagonal 37 m).
# Fence gaps are 2 cells = 4 m (hole_cells).

seed: 42
chunk_width: 64

height_generation/mode: superflat
height_generation/superflat_height: 0

house_generation/mode: uniform
house_generation/allowed_prefabs: ""

world_bounds/width: 236
world_bounds/height: 220
world_bounds/structures_margin: 0
world_bounds/boundary_type: visible_wall
world_bounds/boundary_height: 20

layout/mode: maze
layout/structures/types: ""
layout/roads/mode: none

maze/mode: cell_grid
maze/cell_size: 2.0
maze/wall_height: 3.0
maze/border_walls: 1
maze/edge_walls_only: 1
maze/semantic_name: maze_wall

maze/cell_grid/cols: 2
maze/cell_grid/rows: 2
maze/cell_grid/cell_w_cells: 56
maze/cell_grid/cell_h_cells: 52
maze/cell_grid/fence_cells: 1
maze/cell_grid/outer_fence_cells: 1
maze/cell_grid/holes: all                    # every pair of neighbouring cells connected
maze/cell_grid/extra_hole_probability: 0.0
maze/cell_grid/hole_position: random
maze/cell_grid/hole_cells: 2                 # 4 m gap
maze/cell_grid/margin_floor: 0

# Cell types: exactly 2 park + 2 urban, shuffled per seed.
maze/rooms/types: "park, urban"
maze/rooms/park/min: 2
maze/rooms/park/max: 2
maze/rooms/urban/min: 2
maze/rooms/urban/max: 2

# ── Fill: CityLoader scatters into both cell types ──
city/parent_types: "park, urban"

# urban: two houses per cell
city/urban/allowed_houses: house_basic
city/urban/max_houses: 2
city/urban/max_attempts: 100
city/urban/house_spacing: 6.0
city/urban/margin: 4.0
city/urban/rotation: free
city/urban/layout_mode: random

# park: a few boulders
city/park/allowed_houses: rock1
city/park/max_houses: 3
city/park/max_attempts: 100
city/park/house_spacing: 6.0
city/park/margin: 4.0
city/park/rotation: free
city/park/layout_mode: random

# ── Park vegetation: trees only inside park cells, not on the boulders ──
vegetation/allowed_prefabs: tree1
vegetation/tree1/density: 0.002              # ~23 trees per 112x104 m park before rejection
vegetation/allowed_structures: park
vegetation/denied_structures: rock1

# ── Houses: collapsed walls, as in superdyna_houses ──
house/allowed_door_prefabs: "door1,door2"
house/door1/probability: "1"
house/door2/probability: "0"
house/enable_roofs: "0"
house/chance_wall_broken: "1.0"
house/rubble_prefab: rubble_dense_multisize
house/rubble_mass: "0.2"
house/rubble_mass_multipliers: "1,1000"
house/clutter_density: "0.5"
house/allowed_car_prefabs: car1
house/car_spawn_chance: "0.5"

# ── Smoke: one 2D smoke origin per house_basic (from the prefab), as in superdyna_houses ──
smoke/global_smoke_enabled: "0"
smoke/2dmode_enabled: "1"
smoke/3dmode_enabled: "0"
smoke/default_radius: 20
smoke/default_density: 0.1
smoke/corruption_mode: "effective_range"
smoke/effective_range: 6
smoke/effective_range_variance: 1

# ── Walkers: spawn only in park cells (off boulders); behaviour as in superdyna_houses ──
# Only the spawn point is filtered — walkers can wander into urban cells through the holes.
chaotic_walkers/enabled: "1"
chaotic_walkers/prefab_name: chaotic_walker_abstract
chaotic_walkers/density: "0.005"
chaotic_walkers/allowed_structures: park
chaotic_walkers/denied_structures: rock1
chaotic_walkers/sleep_distance: "40"
chaotic_walkers/max_ticks_per_step: "50"
chaotic_walkers/avoidance_probability: "0.5"
chaotic_walkers/aggression_probability: "0"
chaotic_walkers/reaction_radius: "5"
chaotic_walkers/reaction_velocity: "2"
chaotic_walkers/min_velocity: "1"
chaotic_walkers/max_velocity: "1.5"
chaotic_walkers/walk_duration_min_sec: "1.0"
chaotic_walkers/walk_duration_max_sec: "3.0"
chaotic_walkers/pause_duration_min_sec: "0.5"
chaotic_walkers/pause_duration_max_sec: "2.0"
chaotic_walkers/bounded: "0"
chaotic_walkers/bound_radius: "15"
chaotic_walkers/inward_bias_strength: "2"

# ── Agent: start in any cell, outside houses and boulders ──
agents_spawn_pos/mode: in_structures
agents_spawn_pos/allowed_structures: "park, urban"
agents_spawn_pos/denied_structures: "house, rock1"
agents_spawn_pos/randomize_rotation: 1

# ── Rewards: four per house (as in superdyna_houses / cell_grid_households), none in parks ──
reward_objects/prefab_name: reward_obj1
reward_objects/uniform_density: "0"
reward_objects/allowed_structures: "house_basic"
reward_objects/house_basic/min_per_structure: "4"
reward_objects/house_basic/max_per_structure: "4"
