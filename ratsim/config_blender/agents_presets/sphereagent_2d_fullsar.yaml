prefab_name: SphereAgent
name_prefix: rat1
sensors:
  - name: lidar2d
    maxRange: 30.0
    angleStartDeg: -90
    angleEndDeg: 90
    angleIncrementDeg: 10
    occlusionRegion: none
    occlusionDistance: 0.5
    semanticSet: reward_smoke_rubble_walkers_boundary
  - name: relative_pose
    # Position-from-spawn divisor tracks the arena instead of a flat 300, so the
    # 1000x1000 `default` world no longer pushes gps outside Box(-1, 1).
    rl_scaling_mode: automatic
  - name: collision
  - name: compass
    biasRad: 0.0
  # - name: sector_signal
  #   channels: reward
  #   nSectors: 5
  #   sigmaBins: 1.0
  #   topicPrefix: /sector_signal
actuators: velocity
velocity/steeringBias: 0.0
velocity/blockLeftTurn: false
velocity/blockRightTurn: false
max_health: 100.0
