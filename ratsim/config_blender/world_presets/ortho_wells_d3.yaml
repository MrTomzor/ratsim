# Difficulty overlay d3 for maze_ortho_wells — layer AFTER the base:
#   blend_presets("world", ["maze_ortho_wells", "ortho_wells_d3"])
#
# Mid-size arena, ~3 rooms per arm. Spawn scaffold removed: the agent now starts
# in the central chamber and must first FIND Home.
# prime_home_reward is fixed in the base preset — never overridden here.

world_bounds/width: 140
world_bounds/height: 140

maze/n_rooms: 13                       # chamber + home + 11 reward rooms
maze/room_max_size_cells: 23
maze/rooms/reward_room/min: 11
maze/rooms/reward_room/max: 11

agents_spawn_pos/allowed_structures: "central_chamber"

wells/cue/range: "220"                 # ≈ arena diagonal (198) + margin
