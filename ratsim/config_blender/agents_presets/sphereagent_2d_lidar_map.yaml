# sphereagent_2d_lidar_20m + the occupancy_map observation (map-oracle
# variant of the 4arm-submazes search agent, ICLR rebuttal).
prefab_name: SphereAgent
name_prefix: rat1
sensors:
  - name: lidar2d
    maxRange: 30.0
    angleStartDeg: -90
    angleEndDeg: 90
    angleIncrementDeg: 10
    occlusionRegion: none
    occlusionDistance: 0.5
    semanticSet: reward_and_boundary_only
  - name: collision
  - name: relative_pose
  - name: compass
    biasRad: 0.0
  # Python-only: sensed occupancy map (lidar + ground-truth pose, i.e. the
  # frontier explorer's map) as a 128x128x3 uint8 image observation. Never
  # sent to Unity. See ratsim/task_tracker/occupancy_map_obs.py.
  - name: occupancy_map
    size: 128
    supersample: 2
    reward_descriptor_index: 0   # class 0 of reward_and_boundary_only = reward cube
    agent_marker_radius: 1
  # - name: sector_signal
  #   channels: reward
  #   nSectors: 5
  #   sigmaBins: 1.0
  #   topicPrefix: /sector_signal
actuators: velocity
velocity/steeringBias: 0.0
velocity/blockLeftTurn: false
velocity/blockRightTurn: false
max_health: 100.0
