# sphereagent_2d_lidar_20m without relative_pose: no position observation at all
# (compass kept). Position-input ablation arm of defs/memory_orthomaze_pose_ablation.
prefab_name: SphereAgent
name_prefix: rat1
sensors:
  - name: lidar2d
    maxRange: 20.0
    angleStartDeg: -90
    angleEndDeg: 90
    angleIncrementDeg: 10
    occlusionRegion: none
    occlusionDistance: 0.5
    semanticSet: reward_and_boundary_only
  - name: collision
  - name: compass
    biasRad: 0.0
  # - name: sector_signal
  #   channels: reward
  #   nSectors: 5
  #   sigmaBins: 1.0
  #   topicPrefix: /sector_signal
actuators: velocity
velocity/steeringBias: 0.0
velocity/blockLeftTurn: false
velocity/blockRightTurn: false
max_health: 100.0
