# Difficulty overlay d1 (EASIEST) for maze_ortho_wells — layer AFTER the base:
#   blend_presets("world", ["maze_ortho_wells", "ortho_wells_d1"])
#
# Smallest arena, one room per arm (4 wells total), agent starts AT the Home well.
# NOTE: prime_home_reward is fixed in the base preset — never overridden here.
# Coupled keys that must move together per level: world_bounds ↔ n_rooms ↔
# reward_room min/max (= n_rooms − 2) ↔ room_max_size_cells ↔ cue/range.

world_bounds/width: 80
world_bounds/height: 80

maze/n_rooms: 5                        # chamber + home + 3 reward rooms (1 room per arm)
maze/room_max_size_cells: 15           # big rooms won't fit small sectors
maze/rooms/reward_room/min: 3
maze/rooms/reward_room/max: 3

agents_spawn_pos/allowed_structures: "home_well_room"   # start AT Home

wells/cue/range: "135"                 # ≈ arena diagonal (113) + margin
